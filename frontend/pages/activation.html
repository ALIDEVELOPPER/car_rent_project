<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Licence — Agence Location</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <script src="/static/i18n/fr.js"></script>
  <script src="/static/i18n/ar.js"></script>
  <script src="/static/js/i18n.js"></script>
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .login-card { width: 100%; max-width: 460px; }
    .login-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      justify-content: center;
      margin-bottom: var(--space-2);
    }
    .login-brand .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--color-primary-contrast);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .blocked-message {
      text-align: center;
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      line-height: 1.6;
      margin-bottom: var(--space-4);
    }
    .contact-box {
      text-align: center;
      font-weight: 600;
      background: var(--color-surface-2, var(--color-danger-bg));
      border-radius: var(--radius-sm);
      padding: var(--space-3);
      margin-bottom: var(--space-4);
      font-size: var(--text-sm);
    }
    .theme-toggle-fixed { position: fixed; top: var(--space-4); right: var(--space-4); }
  </style>
</head>
<body>
  <div class="login-page" x-data="activationPage()" x-init="init()">
    <div class="login-card card">
      <div class="login-brand">
        <span class="logo-mark">AL</span>
        <h1 style="font-size: var(--text-lg)">Agence Location</h1>
      </div>

      <template x-if="checking">
        <p class="blocked-message" x-text="t('licence.checking')"></p>
      </template>

      <template x-if="!checking">
        <div>
          <p class="blocked-message" x-text="blockedMessage"></p>
          <template x-if="contact">
            <div class="contact-box" x-text="contact"></div>
          </template>
          <button
            class="btn btn-primary"
            style="width: 100%"
            @click="recheck"
            :disabled="loading"
          >
            <span x-text="loading ? t('licence.retrying') : t('licence.retry')"></span>
          </button>
        </div>
      </template>
    </div>
  </div>

  <button class="lang-toggle lang-toggle-fixed" onclick="toggleLang()" data-i18n="lang.toggle">العربية</button>
  <button class="theme-toggle theme-toggle-fixed" onclick="toggleTheme()" data-i18n-aria="theme.toggle" aria-label="Changer de thème">
    <span id="theme-toggle-icon"></span>
  </button>

  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/pages/activation.js"></script>
</body>
</html>
