<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activation — Agence Location</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      justify-content: center;
      margin-bottom: var(--space-2);
    }
    .login-brand .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--color-primary-contrast);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .login-subtitle {
      text-align: center;
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      margin-bottom: var(--space-6);
    }
    .login-error {
      background: var(--color-danger-bg);
      color: var(--color-danger);
      border-radius: var(--radius-sm);
      padding: var(--space-3);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
    }
    .blocked-message {
      text-align: center;
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      line-height: 1.6;
    }
    .theme-toggle-fixed {
      position: fixed;
      top: var(--space-4);
      right: var(--space-4);
    }
  </style>
</head>
<body>
  <div class="login-page" x-data="activationPage()" x-init="init()">
    <div class="login-card card">
      <div class="login-brand">
        <span class="logo-mark">AL</span>
        <h1 style="font-size: var(--text-lg)">Agence Location</h1>
      </div>

      <template x-if="checking">
        <p class="blocked-message">Vérification en cours...</p>
      </template>

      <template x-if="!checking && needsActivation">
        <div>
          <p class="login-subtitle">Entrez le code d'activation fourni à l'achat</p>

          <template x-if="error">
            <div class="login-error" x-text="error"></div>
          </template>

          <form @submit.prevent="submit" onsubmit="return false">
            <div class="form-group">
              <label for="code">Code d'activation</label>
              <input class="input" type="text" id="code" x-model="code" required autofocus />
            </div>
            <button class="btn btn-primary" type="submit" style="width: 100%" :disabled="loading">
              <span class="spinner" x-show="loading" style="border-top-color: #fff"></span>
              <span x-text="loading ? 'Activation...' : 'Activer'"></span>
            </button>
          </form>
        </div>
      </template>

      <template x-if="!checking && !needsActivation">
        <div>
          <p class="blocked-message" x-text="blockedMessage"></p>
          <button class="btn btn-secondary" style="width: 100%; margin-top: var(--space-4)" @click="recheck" :disabled="loading">
            <span x-text="loading ? 'Vérification...' : 'Réessayer'"></span>
          </button>
        </div>
      </template>
    </div>
  </div>

  <button class="theme-toggle theme-toggle-fixed" onclick="toggleTheme()" aria-label="Changer de thème">
    <span id="theme-toggle-icon"></span>
  </button>

  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/pages/activation.js"></script>
</body>
</html>
