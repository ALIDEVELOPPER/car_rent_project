<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — Krilia</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <script src="/static/i18n/fr.js"></script>
  <script src="/static/i18n/ar.js"></script>
  <script src="/static/js/i18n.js"></script>
  <style>
    /* ---- couleurs sémantiques par domaine ---- */
    .main-content {
      --c-argent: #059669;
      --c-argent-2: #10b981;
      --c-flotte: #4f46e5;
      --c-flotte-2: #7c3aed;
      --c-activite: #0284c7;
      --c-activite-2: #0ea5e9;
      --c-alerte: #d97706;
      --c-alerte-2: #f59e0b;
      --c-caution: #7c3aed;
      --c-retard: #e11d48;
    }
    :root[data-theme="dark"] .main-content,
    :root:not([data-theme="light"]) .main-content {
      --c-argent: #34d399; --c-argent-2: #10b981;
      --c-flotte: #818cf8; --c-flotte-2: #a78bfa;
      --c-activite: #38bdf8; --c-activite-2: #0ea5e9;
      --c-alerte: #fbbf24; --c-alerte-2: #f59e0b;
      --c-caution: #a78bfa;
      --c-retard: #fb7185;
    }

    .dash-section { margin-bottom: var(--space-5); }
    .w-title { font-size: var(--text-xs); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-muted); }

    /* ---- bande KPI héro ---- */
    .kpi-hero { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
    @media (max-width: 1100px) { .kpi-hero { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .kpi-hero { grid-template-columns: 1fr; } }

    .kpi {
      position: relative; overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 4px;
      min-height: 148px;
    }
    .kpi::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
      background: var(--kpi-accent, var(--color-primary));
    }
    [dir="rtl"] .kpi::before { inset: 0 0 0 auto; }
    .kpi::after {
      content: ""; position: absolute; top: -40px; inset-inline-end: -40px;
      width: 130px; height: 130px; border-radius: 50%;
      background: var(--kpi-accent, var(--color-primary)); opacity: .07;
    }
    .kpi-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .kpi-icon {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, var(--kpi-accent), var(--kpi-accent-2, var(--kpi-accent)));
    }
    .kpi-value { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 6px; }
    .kpi-value small { font-size: 15px; font-weight: 700; color: var(--color-text-muted); margin-inline-start: 4px; }
    .kpi-sub { font-size: 12.5px; color: var(--color-text-secondary); }
    .kpi-trend { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
    .kpi-trend.up { background: color-mix(in srgb, var(--c-argent) 16%, transparent); color: var(--c-argent); }
    .kpi-trend.down { background: color-mix(in srgb, var(--c-retard) 16%, transparent); color: var(--c-retard); }

    .kpi-spark { display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-top: auto; }
    .kpi-spark > div { flex: 1; border-radius: 2px 2px 0 0; min-height: 3px; background: color-mix(in srgb, var(--kpi-accent) 30%, transparent); }
    .kpi-spark > div.last { background: linear-gradient(180deg, var(--kpi-accent), var(--kpi-accent-2, var(--kpi-accent))); }

    .kpi-bar { height: 8px; border-radius: 999px; background: var(--color-neutral-bg); overflow: hidden; margin-top: auto; }
    .kpi-bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--kpi-accent), var(--kpi-accent-2, var(--kpi-accent))); }

    .kpi.clickable { cursor: pointer; transition: transform var(--transition), box-shadow var(--transition); }
    .kpi.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

    /* ---- agenda du jour ---- */
    .agenda-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
    @media (max-width: 1000px) { .agenda-grid { grid-template-columns: 1fr; } }
    .agenda-card { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-sm); overflow: hidden; }
    .agenda-card > header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; font-weight: 800; font-size: 13px; color: #fff;
      background: linear-gradient(135deg, var(--ac), var(--ac2, var(--ac)));
    }
    .agenda-card > header .pill { background: rgba(255,255,255,.25); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
    .agenda-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 90px; }
    .ag-row { display: flex; align-items: center; gap: 11px; }
    .ag-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
    .ag-main { flex: 1; min-width: 0; }
    .ag-name { font-weight: 700; font-size: 13.5px; }
    .ag-sub { font-size: 12px; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ag-empty { font-size: 13px; color: var(--color-text-muted); }
    .ag-time { font-size: 12px; font-weight: 800; color: var(--color-text-secondary); }

    /* ---- lignes / panneaux ---- */
    .split { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-4); }
    @media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
    .panel { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-sm); padding: var(--space-5); }
    .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
    .panel-head .sub { font-size: 12px; color: var(--color-text-muted); }

    /* ---- rentabilité flotte ---- */
    .renta-row { display: grid; grid-template-columns: 150px 1fr auto; align-items: center; gap: 12px; padding: 7px 0; }
    @media (max-width: 620px) { .renta-row { grid-template-columns: 110px 1fr; } .renta-row .renta-ca { grid-column: 2; text-align: start; } }
    .renta-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .renta-name span { display: block; font-size: 11px; font-weight: 500; color: var(--color-text-muted); }
    .renta-track { height: 22px; border-radius: 6px; background: var(--color-neutral-bg); overflow: hidden; }
    .renta-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--c-flotte), var(--c-flotte-2)); min-width: 3px; }
    .renta-fill.neg { background: linear-gradient(90deg, var(--c-retard), #f97316); }
    .renta-ca { font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }

    /* ---- indicateurs clés ---- */
    .ind-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .ind { padding: 12px 14px; border-radius: var(--radius-md); background: var(--color-surface-alt); border: 1px solid var(--color-border); }
    .ind-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--color-text-muted); }
    .ind-value { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin-top: 3px; }
    .ind-value small { font-size: 12px; font-weight: 700; color: var(--color-text-muted); }

    /* ---- flotte donut ---- */
    .donut-wrap { position: relative; width: 118px; height: 118px; flex-shrink: 0; }
    .donut { width: 100%; height: 100%; border-radius: 50%; transition: background .35s ease; }
    .donut::after { content: ""; position: absolute; inset: 19px; border-radius: 50%; background: var(--color-surface); }
    .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
    .donut-center b { font-size: 21px; font-weight: 800; }
    .donut-center span { font-size: 10px; color: var(--color-text-muted); }
    .donut-legend { display: flex; flex-direction: column; gap: 9px; font-size: 12.5px; }
    .donut-legend > div { display: flex; align-items: center; gap: 7px; }
    .donut-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
    .donut-pct { color: var(--color-text-muted); font-size: 11.5px; }

    /* ---- cartes alerte ---- */
    .alert-card { border-radius: var(--radius-lg); padding: var(--space-5); border: 1px solid; }
    .alert-card.warn { border-color: color-mix(in srgb, var(--c-alerte) 45%, var(--color-border)); background: color-mix(in srgb, var(--c-alerte) 13%, var(--color-surface)); }
    .alert-card.info { border-color: color-mix(in srgb, var(--c-caution) 40%, var(--color-border)); background: color-mix(in srgb, var(--c-caution) 12%, var(--color-surface)); }
    .alert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 420px)); gap: 10px 24px; }

    /* ---- planning 7 jours ---- */
    .plan-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 720px) { .plan-grid { grid-template-columns: repeat(3, 1fr); } }
    .plan-col { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px; background: var(--color-surface-alt); border: 1px solid var(--color-border); min-height: 68px; }
    .plan-col.today { border-color: var(--c-flotte); box-shadow: inset 0 0 0 1px var(--c-flotte); }
    .plan-day { font-size: 11px; font-weight: 800; color: var(--color-text-muted); text-align: center; text-transform: uppercase; }
    .plan-item { border-radius: 6px; font-size: 10.5px; font-weight: 700; padding: 4px 6px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(135deg, var(--c-flotte), var(--c-flotte-2)); }
    .plan-count { text-align: center; font-size: 11px; font-weight: 800; color: var(--c-flotte); }

    .sk-line { height: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content" x-data="dashboardPage()" x-init="init()">
      <div class="topbar">
        <div>
          <h1 data-i18n="dashboard.title">Tableau de bord</h1>
          <div style="font-size: 12.5px; color: var(--color-text-muted); margin-top: 1px;" x-text="dateLabel"></div>
        </div>
        <div class="topbar-actions">
          <a href="/reservations" class="btn btn-primary btn-sm" x-text="t('dashboard.action_reservation')"></a>
          <button class="lang-toggle" onclick="toggleLang()" data-i18n="lang.toggle">العربية</button>
          <button class="theme-toggle" onclick="toggleTheme()" data-i18n-aria="theme.toggle" aria-label="Changer de thème"><span id="theme-toggle-icon"></span></button>
        </div>
      </div>

      <div class="page-content">

        <template x-if="loading">
          <div>
            <div class="kpi-hero dash-section">
              <template x-for="i in 4" :key="i">
                <div class="kpi"><div class="skeleton sk-line" style="width: 50%; margin-bottom: 16px;"></div><div class="skeleton" style="width: 70%; height: 26px; border-radius: 8px; margin-bottom: 14px;"></div><div class="skeleton sk-line" style="width: 90%;"></div></div>
              </template>
            </div>
            <div class="agenda-grid dash-section">
              <template x-for="i in 3" :key="i">
                <div class="agenda-card"><div class="skeleton" style="height: 42px;"></div><div style="padding: 16px;"><div class="skeleton sk-line" style="width: 80%; margin-bottom: 12px;"></div><div class="skeleton sk-line" style="width: 65%;"></div></div></div>
              </template>
            </div>
          </div>
        </template>

        <template x-if="!loading && data">
          <div>

            <!-- ===== Bande KPI ===== -->
            <div class="kpi-hero dash-section">

              <!-- Encaissé ce mois -->
              <div class="kpi" style="--kpi-accent: var(--c-argent); --kpi-accent-2: var(--c-argent-2);">
                <div class="kpi-head">
                  <span class="w-title" x-text="t('dashboard.hero_revenus')"></span>
                  <span class="kpi-icon" style="--kpi-accent: var(--c-argent); --kpi-accent-2: var(--c-argent-2);">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                  </span>
                </div>
                <div class="kpi-value"><span x-text="fmt(data.revenus.mois)"></span><small x-text="devise"></small></div>
                <div class="kpi-sub" style="display:flex; align-items:center; gap:8px;">
                  <span class="kpi-trend" :class="data.revenus.variation_pct >= 0 ? 'up' : 'down'" x-show="data.revenus.variation_pct !== null">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" :style="data.revenus.variation_pct < 0 ? 'transform: rotate(180deg)' : ''"><path d="M7 14l5-5 5 5"/></svg>
                    <span x-text="(data.revenus.variation_pct >= 0 ? '+' : '') + data.revenus.variation_pct + '%'"></span>
                  </span>
                  <span x-text="t('dashboard.vs_mois_dernier')"></span>
                </div>
                <div class="kpi-spark" x-show="revenus6.length && !data.revenus.objectif">
                  <template x-for="(v, i) in revenus6" :key="i">
                    <div :class="i === revenus6.length - 1 ? 'last' : ''" :style="`height:${Math.max(8, (v / sparkMax) * 100)}%`"></div>
                  </template>
                </div>
                <div x-show="data.revenus.objectif" style="margin-top: auto;">
                  <div style="display:flex; justify-content:space-between; gap:6px; font-size:11px; color: var(--color-text-muted); margin-bottom:4px;">
                    <b style="color: var(--c-argent);" x-text="t('dashboard.objectif_atteint', { pct: Math.round(data.revenus.objectif_pct || 0) })"></b>
                    <span x-show="data.revenus.projection_mois" x-text="t('dashboard.projection', { montant: fmt(data.revenus.projection_mois), devise })"></span>
                  </div>
                  <div class="kpi-bar" style="margin-top:0;"><div :style="`width:${Math.min(100, data.revenus.objectif_pct || 0)}%`"></div></div>
                </div>
              </div>

              <!-- Taux d'occupation -->
              <div class="kpi" style="--kpi-accent: var(--c-flotte); --kpi-accent-2: var(--c-flotte-2);">
                <div class="kpi-head">
                  <span class="w-title" x-text="t('dashboard.taux_occupation')"></span>
                  <span class="kpi-icon" style="--kpi-accent: var(--c-flotte); --kpi-accent-2: var(--c-flotte-2);">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 17h14M6 17V9l3-2 3 2 3-1.5 3 1.5v8M9 17v-3h6v3"/><circle cx="8" cy="19" r="1.6"/><circle cx="16" cy="19" r="1.6"/></svg>
                  </span>
                </div>
                <div class="kpi-value"><span x-text="Math.round(data.taux_occupation)"></span><small>%</small></div>
                <div class="kpi-sub" x-text="t('dashboard.vehicules_dehors', { n: data.flotte.loue, total: flotteActive })"></div>
                <div class="kpi-bar"><div :style="`width:${Math.min(100, data.taux_occupation)}%`"></div></div>
              </div>

              <!-- Locations ce mois -->
              <div class="kpi" style="--kpi-accent: var(--c-activite); --kpi-accent-2: var(--c-activite-2);">
                <div class="kpi-head">
                  <span class="w-title" x-text="t('dashboard.hero_locations')"></span>
                  <span class="kpi-icon" style="--kpi-accent: var(--c-activite); --kpi-accent-2: var(--c-activite-2);">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                  </span>
                </div>
                <div class="kpi-value" x-text="data.indicateurs.locations_mois"></div>
                <div class="kpi-sub" x-text="t('dashboard.nouveaux_clients', { n: data.indicateurs.nouveaux_clients_mois })"></div>
                <div class="kpi-sub" style="margin-top: auto;">
                  <span x-text="t('dashboard.panier_moyen')"></span> :
                  <b x-text="fmt(data.indicateurs.panier_moyen) + ' ' + devise"></b>
                </div>
              </div>

              <!-- Impayés -->
              <a href="/factures" class="kpi clickable" style="--kpi-accent: var(--c-alerte); --kpi-accent-2: var(--c-alerte-2); text-decoration: none; color: inherit;">
                <div class="kpi-head">
                  <span class="w-title" x-text="t('dashboard.hero_impayes')"></span>
                  <span class="kpi-icon" style="--kpi-accent: var(--c-alerte); --kpi-accent-2: var(--c-alerte-2);">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
                  </span>
                </div>
                <div class="kpi-value"><span x-text="fmt(data.impayes.total)"></span><small x-text="devise"></small></div>
                <div class="kpi-sub" x-text="data.impayes.nombre === 1 ? t('dashboard.impayes_detail_one') : t('dashboard.impayes_detail_many', { n: data.impayes.nombre })"></div>
                <div class="kpi-sub" style="margin-top: auto; color: var(--c-alerte); font-weight: 700; display:flex; align-items:center; gap:4px;">
                  <span x-text="t('dashboard.voir_impayes')"></span>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
                </div>
              </a>
            </div>

            <!-- ===== Agenda du jour ===== -->
            <div class="agenda-grid dash-section">
              <!-- Départs -->
              <div class="agenda-card">
                <header style="--ac: var(--c-flotte); --ac2: var(--c-flotte-2);">
                  <span x-text="t('dashboard.departs_jour')"></span>
                  <span class="pill" x-text="data.agenda.departs.length"></span>
                </header>
                <div class="agenda-body">
                  <template x-if="data.agenda.departs.length === 0"><div class="ag-empty" x-text="t('dashboard.aucun_depart')"></div></template>
                  <template x-for="r in data.agenda.departs" :key="r.id">
                    <div class="ag-row">
                      <span class="ag-dot" style="background: var(--c-flotte);"></span>
                      <div class="ag-main"><div class="ag-name" x-text="r.client"></div><div class="ag-sub" x-text="`${r.vehicule} · ${r.immatriculation}`"></div></div>
                      <span x-show="r.heure" class="ag-time" x-text="r.heure"></span>
                      <span class="badge" :class="r.statut === 'confirmee' ? 'badge-info' : 'badge-neutral'" x-text="t('reservations.statut.' + r.statut)"></span>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Retours -->
              <div class="agenda-card">
                <header style="--ac: var(--c-argent); --ac2: var(--c-argent-2);">
                  <span x-text="t('dashboard.retours_attendus')"></span>
                  <span class="pill" x-text="data.agenda.retours.length"></span>
                </header>
                <div class="agenda-body">
                  <template x-if="data.agenda.retours.length === 0"><div class="ag-empty" x-text="t('dashboard.aucun_retour')"></div></template>
                  <template x-for="r in data.agenda.retours" :key="r.id">
                    <div class="ag-row">
                      <span class="ag-dot" style="background: var(--c-argent);"></span>
                      <div class="ag-main"><div class="ag-name" x-text="r.client"></div><div class="ag-sub" x-text="`${r.vehicule} · ${r.immatriculation}`"></div></div>
                      <span x-show="r.heure" class="ag-time" x-text="r.heure"></span>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Retards -->
              <div class="agenda-card">
                <header :style="data.agenda.retards.length ? '--ac: var(--c-retard); --ac2: #f97316;' : '--ac: var(--color-text-muted); --ac2: var(--color-text-muted);'">
                  <span x-text="t('dashboard.retards')"></span>
                  <span class="pill" x-text="data.agenda.retards.length"></span>
                </header>
                <div class="agenda-body">
                  <template x-if="data.agenda.retards.length === 0"><div class="ag-empty" x-text="t('dashboard.aucun_retard')"></div></template>
                  <template x-for="r in data.agenda.retards" :key="r.id">
                    <div class="ag-row">
                      <span class="ag-dot" style="background: var(--c-retard);"></span>
                      <div class="ag-main"><div class="ag-name" x-text="r.client"></div><div class="ag-sub" x-text="`${r.vehicule} · ${r.immatriculation}`"></div></div>
                      <span style="font-size: 12px; font-weight: 800; color: var(--c-retard);" x-text="t('dashboard.retard_abbr', { n: r.retard_jours })"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- ===== Revenus 12 mois + Flotte ===== -->
            <div class="split dash-section">
              <div class="panel">
                <div class="panel-head">
                  <span class="w-title" x-text="t('dashboard.revenus_par_mois')"></span>
                  <span class="sub" x-text="t('dashboard.revenus_12_mois')"></span>
                </div>
                <div style="height: 250px;"><canvas id="chart-revenus-annee"></canvas></div>
              </div>

              <div class="panel">
                <div class="panel-head"><span class="w-title" x-text="t('dashboard.flotte')"></span></div>
                <div style="display: flex; align-items: center; gap: 22px; flex-wrap: wrap;">
                  <div class="donut-wrap">
                    <div class="donut" :style="donutStyle"></div>
                    <div class="donut-center">
                      <b x-text="flotte.total"></b>
                      <span x-text="t('dashboard.nb_vehicules')"></span>
                    </div>
                  </div>
                  <div class="donut-legend">
                    <template x-for="seg in flotte.segments" :key="seg.key">
                      <div>
                        <i :style="`background:${seg.color}`"></i>
                        <b x-text="seg.n"></b>&nbsp;
                        <span x-text="t('vehicules.statut.' + seg.key).toLowerCase()"></span>
                        <span class="donut-pct" x-show="flotte.total" x-text="'· ' + seg.pct + '%'"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>

            <!-- ===== Rentabilité flotte + Indicateurs ===== -->
            <div class="split dash-section">
              <div class="panel">
                <div class="panel-head">
                  <span class="w-title" x-text="t('dashboard.rentabilite')"></span>
                  <span class="sub" x-text="t('dashboard.rentabilite_sub')"></span>
                </div>
                <template x-if="!data.rentabilite.length">
                  <div class="ag-empty" x-text="t('dashboard.aucune_facture')"></div>
                </template>
                <template x-for="v in data.rentabilite" :key="v.vehicule_id">
                  <div class="renta-row">
                    <div class="renta-name" x-text="v.vehicule"><span x-text="v.immatriculation"></span></div>
                    <div class="renta-track"><div class="renta-fill" :class="Number(v.marge) < 0 ? 'neg' : ''" :style="`width:${margePct(v.marge)}%`"></div></div>
                    <div class="renta-ca">
                      <span x-text="fmt(v.marge) + ' ' + devise"></span>
                      <span style="display:block; font-size:11px; font-weight:600; color: var(--color-text-muted);"
                        x-text="t('dashboard.ca_court') + ' ' + fmt(v.ca) + ' · ' + t('dashboard.charges') + ' ' + fmt(v.charges)"></span>
                    </div>
                  </div>
                </template>
              </div>

              <div class="panel">
                <div class="panel-head"><span class="w-title" x-text="t('dashboard.indicateurs')"></span></div>
                <div class="ind-grid">
                  <div class="ind">
                    <div class="ind-label" x-text="t('dashboard.panier_moyen')"></div>
                    <div class="ind-value"><span x-text="fmt(data.indicateurs.panier_moyen)"></span> <small x-text="devise"></small></div>
                  </div>
                  <div class="ind">
                    <div class="ind-label" x-text="t('dashboard.duree_moyenne')"></div>
                    <div class="ind-value"><span x-text="data.indicateurs.duree_moyenne_jours"></span> <small x-text="t('dashboard.jour_abbr')"></small></div>
                  </div>
                  <div class="ind">
                    <div class="ind-label" x-text="t('dashboard.taux_recouvrement')"></div>
                    <div class="ind-value" x-text="data.indicateurs.taux_recouvrement === null ? '—' : data.indicateurs.taux_recouvrement + ' %'"></div>
                  </div>
                  <div class="ind">
                    <div class="ind-label" x-text="t('dashboard.locations_12m')"></div>
                    <div class="ind-value" x-text="data.indicateurs.nb_locations_12m"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- ===== Canaux d'acquisition ===== -->
            <div class="panel dash-section" x-show="data.sources && data.sources.length">
              <div class="panel-head">
                <span class="w-title" x-text="t('dashboard.canaux')"></span>
                <span class="sub" x-text="t('dashboard.canaux_sub')"></span>
              </div>
              <div style="display:flex; flex-direction:column; gap:10px;">
                <template x-for="s in data.sources" :key="s.source">
                  <div style="display:grid; grid-template-columns: 140px 1fr 40px; align-items:center; gap:12px;">
                    <span style="font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" x-text="t('reservations.source.' + s.source)"></span>
                    <div class="renta-track" style="height:16px;">
                      <div class="renta-fill" :style="`width:${Math.max(4, s.pct)}%; background: linear-gradient(90deg, var(--c-activite), var(--c-activite-2))`"></div>
                    </div>
                    <span style="font-size:12px; font-weight:800; text-align:end; font-variant-numeric: tabular-nums;" x-text="s.nombre"></span>
                  </div>
                </template>
              </div>
            </div>

            <!-- ===== Échéances véhicules ===== -->
            <div class="alert-card warn dash-section" x-show="data.echeances.length">
              <div class="panel-head">
                <span class="w-title" style="display:flex; align-items:center; gap:7px; color: var(--c-alerte);">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
                  <span x-text="t('dashboard.echeances')"></span>
                </span>
                <span class="badge badge-warning" x-text="data.echeances.length"></span>
              </div>
              <div class="alert-grid">
                <template x-for="e in data.echeances" :key="e.vehicule_id + '-' + e.type">
                  <div class="ag-row">
                    <span class="ag-dot" :style="`background: var(${e.en_retard ? '--c-retard' : '--c-alerte'})`"></span>
                    <div class="ag-main">
                      <div class="ag-name"><span x-text="t('echeance.' + e.type)"></span> — <span x-text="e.vehicule"></span></div>
                      <div class="ag-sub" x-text="e.immatriculation"></div>
                    </div>
                    <span style="font-size: 12px; font-weight: 800;" :style="`color: var(${e.en_retard ? '--c-retard' : '--c-alerte'})`" x-text="echeanceDelai(e)"></span>
                  </div>
                </template>
              </div>
            </div>

            <!-- ===== Cautions à restituer ===== -->
            <div class="alert-card info dash-section" x-show="data.cautions_a_restituer && data.cautions_a_restituer.length">
              <div class="panel-head">
                <span class="w-title" style="display:flex; align-items:center; gap:7px; color: var(--c-caution);">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
                  <span x-text="t('dashboard.cautions')"></span>
                </span>
                <span class="badge" style="background: color-mix(in srgb, var(--c-caution) 16%, transparent); color: var(--c-caution);" x-text="data.cautions_a_restituer.length"></span>
              </div>
              <div class="alert-grid">
                <template x-for="c in data.cautions_a_restituer" :key="c.id">
                  <div class="ag-row">
                    <span class="ag-dot" style="background: var(--c-caution);"></span>
                    <div class="ag-main"><div class="ag-name" x-text="c.client"></div><div class="ag-sub" x-text="c.vehicule"></div></div>
                    <span style="font-size: 13px; font-weight: 800;" x-text="fmt(c.montant) + ' ' + devise"></span>
                  </div>
                </template>
              </div>
            </div>

            <!-- ===== 7 prochains jours ===== -->
            <div class="panel dash-section">
              <div class="panel-head">
                <span class="w-title" x-text="t('dashboard.prochains_jours')"></span>
                <span class="sub" x-text="(() => { const n = data.prochains_jours.reduce((a, j) => a + j.reservations.length, 0); return n === 1 ? t('dashboard.reservations_a_venir_one') : t('dashboard.reservations_a_venir_many', { n }); })()"></span>
              </div>
              <div class="plan-grid">
                <template x-for="(j, idx) in data.prochains_jours" :key="j.date">
                  <div class="plan-col" :class="idx === 0 ? 'today' : ''">
                    <div class="plan-day" x-text="jourCourt(j.date)"></div>
                    <template x-for="r in j.reservations" :key="r.id">
                      <div class="plan-item" x-text="`${r.vehicule} · ${r.nb_jours}${t('dashboard.jour_abbr')}`"></div>
                    </template>
                    <div class="plan-count" x-show="!j.reservations.length" style="color: var(--color-text-muted);">—</div>
                  </div>
                </template>
              </div>
            </div>

          </div>
        </template>
      </div>
    </div>
  </div>

  <script src="/static/vendor/chartjs/chart.umd.js"></script>
  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components/sidebar.js"></script>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/auth-guard.js"></script>
  <script src="/static/js/licence-banner.js"></script>
  <script src="/static/js/pages/dashboard.js"></script>
</body>
</html>
