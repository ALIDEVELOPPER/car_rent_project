<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — Krilia</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <script src="/static/i18n/fr.js"></script>
  <script src="/static/i18n/ar.js"></script>
  <script src="/static/js/i18n.js"></script>
  <style>
    .dash-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); margin-bottom: var(--space-5); }
    @media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } }
    .w-title { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--color-text-muted); }
    .w-count { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent-soft-text); }
    .ag-row { display: flex; align-items: center; gap: 11px; }
    .ag-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
    .ag-main { flex: 1; min-width: 0; }
    .ag-name { font-weight: 700; font-size: 13.5px; }
    .ag-sub { font-size: 12px; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card.danger { border-color: color-mix(in srgb, var(--color-danger) 35%, var(--color-border)); background: color-mix(in srgb, var(--color-danger-bg) 40%, var(--color-surface)); }
    .big-num { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
    .plan-col { display: flex; flex-direction: column; gap: 6px; }
    .plan-day { font-size: 11.5px; font-weight: 700; color: var(--color-text-muted); text-align: center; margin-bottom: 4px; }
    .plan-item { border-radius: 7px; background: var(--accent-soft); color: var(--accent-soft-text); font-size: 11px; font-weight: 700; padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sk-line { height: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content" x-data="dashboardPage()" x-init="init()">
      <div class="topbar">
        <div>
          <h1 data-i18n="dashboard.title">Tableau de bord</h1>
          <div style="font-size: 12.5px; color: var(--color-text-muted); margin-top: 1px;" x-text="dateLabel"></div>
        </div>
        <div class="topbar-actions">
          <button class="lang-toggle" onclick="toggleLang()" data-i18n="lang.toggle">العربية</button>
          <button class="theme-toggle" onclick="toggleTheme()" data-i18n-aria="theme.toggle" aria-label="Changer de thème"><span id="theme-toggle-icon"></span></button>
        </div>
      </div>

      <div class="page-content">

        <!-- Skeleton -->
        <template x-if="loading">
          <div>
            <div class="dash-grid">
              <template x-for="i in 3" :key="i">
                <div class="card">
                  <div class="skeleton sk-line" style="width: 45%; margin-bottom: 18px;"></div>
                  <div class="skeleton sk-line" style="width: 90%; margin-bottom: 12px;"></div>
                  <div class="skeleton sk-line" style="width: 80%; margin-bottom: 12px;"></div>
                  <div class="skeleton sk-line" style="width: 85%;"></div>
                </div>
              </template>
            </div>
            <div class="dash-grid">
              <template x-for="i in 3" :key="i">
                <div class="card"><div class="skeleton sk-line" style="width: 40%; margin-bottom: 16px;"></div><div class="skeleton" style="width: 60%; height: 30px; border-radius: 8px;"></div></div>
              </template>
            </div>
          </div>
        </template>

        <template x-if="!loading && data">
          <div>

            <!-- Row A : agenda du jour -->
            <div class="dash-grid">
              <!-- Départs -->
              <div class="card">
                <div class="flex-between" style="margin-bottom: 14px;">
                  <span class="w-title" x-text="t('dashboard.departs_jour')"></span>
                  <span class="w-count" x-text="data.agenda.departs.length"></span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                  <template x-if="data.agenda.departs.length === 0">
                    <div class="text-secondary" style="font-size: 13px;" x-text="t('dashboard.aucun_depart')"></div>
                  </template>
                  <template x-for="r in data.agenda.departs" :key="r.id">
                    <div class="ag-row">
                      <span class="ag-dot" style="background: var(--color-primary);"></span>
                      <div class="ag-main"><div class="ag-name" x-text="r.client"></div><div class="ag-sub" x-text="`${r.vehicule} · ${r.immatriculation}`"></div></div>
                      <span class="badge" :class="r.statut === 'confirmee' ? 'badge-info' : 'badge-neutral'" x-text="t('reservations.statut.' + r.statut)"></span>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Retours -->
              <div class="card">
                <div class="flex-between" style="margin-bottom: 14px;">
                  <span class="w-title" x-text="t('dashboard.retours_attendus')"></span>
                  <span class="w-count" x-text="data.agenda.retours.length"></span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                  <template x-if="data.agenda.retours.length === 0">
                    <div class="text-secondary" style="font-size: 13px;" x-text="t('dashboard.aucun_retour')"></div>
                  </template>
                  <template x-for="r in data.agenda.retours" :key="r.id">
                    <div class="ag-row">
                      <span class="ag-dot" style="background: var(--color-success);"></span>
                      <div class="ag-main"><div class="ag-name" x-text="r.client"></div><div class="ag-sub" x-text="`${r.vehicule} · ${r.immatriculation}`"></div></div>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Retards -->
              <div class="card" :class="data.agenda.retards.length ? 'danger' : ''">
                <div class="flex-between" style="margin-bottom: 14px;">
                  <span class="w-title" style="display: flex; align-items: center; gap: 7px;" :style="data.agenda.retards.length ? 'color: var(--color-danger)' : ''">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
                    <span x-text="t('dashboard.retards')"></span>
                  </span>
                  <span class="w-count" :style="data.agenda.retards.length ? 'background: var(--color-danger-bg); color: var(--color-danger)' : ''" x-text="data.agenda.retards.length"></span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                  <template x-if="data.agenda.retards.length === 0">
                    <div class="text-secondary" style="font-size: 13px;" x-text="t('dashboard.aucun_retard')"></div>
                  </template>
                  <template x-for="r in data.agenda.retards" :key="r.id">
                    <div class="ag-row">
                      <span class="ag-dot" style="background: var(--color-danger);"></span>
                      <div class="ag-main"><div class="ag-name" x-text="r.client"></div><div class="ag-sub" x-text="`${r.vehicule} · ${r.immatriculation}`"></div></div>
                      <span style="font-size: 12px; font-weight: 800; color: var(--color-danger);" x-text="t('dashboard.retard_abbr', { n: r.retard_jours })"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- Échéances véhicules -->
            <div class="card" style="margin-bottom: var(--space-5);" x-show="data.echeances.length">
              <div class="flex-between" style="margin-bottom: 14px;">
                <span class="w-title" style="display:flex; align-items:center; gap:7px; color: var(--color-warning);">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
                  <span x-text="t('dashboard.echeances')"></span>
                </span>
                <span class="w-count" style="background: var(--color-warning-bg); color: var(--color-warning);" x-text="data.echeances.length"></span>
              </div>
              <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px 20px;">
                <template x-for="e in data.echeances" :key="e.vehicule_id + '-' + e.type">
                  <div class="ag-row">
                    <span class="ag-dot" :style="`background: var(${e.en_retard ? '--color-danger' : '--color-warning'})`"></span>
                    <div class="ag-main">
                      <div class="ag-name"><span x-text="t('echeance.' + e.type)"></span> — <span x-text="e.vehicule"></span></div>
                      <div class="ag-sub" x-text="e.immatriculation"></div>
                    </div>
                    <span style="font-size: 12px; font-weight: 700;" :style="`color: var(${e.en_retard ? '--color-danger' : '--color-warning'})`" x-text="echeanceDelai(e)"></span>
                  </div>
                </template>
              </div>
            </div>

            <!-- Cautions à restituer -->
            <div class="card" style="margin-bottom: var(--space-5);" x-show="data.cautions_a_restituer && data.cautions_a_restituer.length">
              <div class="flex-between" style="margin-bottom: 14px;">
                <span class="w-title" x-text="t('dashboard.cautions')"></span>
                <span class="w-count" x-text="data.cautions_a_restituer.length"></span>
              </div>
              <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 20px;">
                <template x-for="c in data.cautions_a_restituer" :key="c.id">
                  <div class="ag-row">
                    <span class="ag-dot" style="background: var(--color-info);"></span>
                    <div class="ag-main"><div class="ag-name" x-text="c.client"></div><div class="ag-sub" x-text="c.vehicule"></div></div>
                    <span style="font-size: 13px; font-weight: 800;" x-text="fmt(c.montant) + ' ' + devise"></span>
                  </div>
                </template>
              </div>
            </div>

            <!-- Row B : argent + flotte -->
            <div class="dash-grid">
              <!-- Impayés -->
              <div class="card">
                <span class="w-title" x-text="t('dashboard.impayes')"></span>
                <div style="display: flex; align-items: baseline; gap: 8px; margin: 12px 0 4px;">
                  <span class="big-num" x-text="fmt(data.impayes.total)"></span>
                  <span style="font-size: 14px; font-weight: 700; color: var(--color-text-muted);" x-text="devise"></span>
                </div>
                <div style="font-size: 12.5px; color: var(--color-text-secondary);"
                  x-text="data.impayes.nombre === 1 ? t('dashboard.impayes_detail_one') : t('dashboard.impayes_detail_many', { n: data.impayes.nombre })"></div>
                <a href="/factures" style="display: inline-flex; align-items: center; gap: 4px; margin-top: 14px; font-size: 13px;">
                  <span x-text="t('dashboard.voir_impayes')"></span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
                </a>
              </div>

              <!-- Revenus -->
              <div class="card">
                <span class="w-title" x-text="t('dashboard.revenus_mois')"></span>
                <div style="display: flex; align-items: baseline; gap: 8px; margin: 12px 0 6px;">
                  <span class="big-num" x-text="fmt(data.revenus.mois)"></span>
                  <span style="font-size: 14px; font-weight: 700; color: var(--color-text-muted);" x-text="devise"></span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;" x-show="data.revenus.variation_pct !== null">
                  <span class="badge" :class="data.revenus.variation_pct >= 0 ? 'badge-success' : 'badge-danger'">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" :style="data.revenus.variation_pct < 0 ? 'transform: rotate(180deg);' : ''"><path d="M7 14l5-5 5 5"/></svg>
                    <span x-text="(data.revenus.variation_pct >= 0 ? '+' : '') + data.revenus.variation_pct + ' %'"></span>
                  </span>
                  <span style="font-size: 12.5px; color: var(--color-text-muted);" x-text="t('dashboard.vs_mois_dernier')"></span>
                </div>
                <div style="display: flex; align-items: flex-end; gap: 5px; height: 40px; margin-top: 16px;" x-show="revenus6.length">
                  <template x-for="(v, i) in revenus6" :key="i">
                    <div :style="`flex:1; height:${Math.max(6, (v / sparkMax) * 100)}%; border-radius:3px; background:${i === revenus6.length - 1 ? 'var(--gradient-primary)' : 'var(--color-border-strong)'};`"></div>
                  </template>
                </div>
              </div>

              <!-- Flotte -->
              <div class="card">
                <span class="w-title" x-text="t('dashboard.flotte')"></span>
                <div style="display: flex; align-items: center; gap: 20px; margin-top: 14px;">
                  <svg width="96" height="96" viewBox="0 0 42 42" style="flex-shrink: 0;">
                    <circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--color-border)" stroke-width="6"></circle>
                    <template x-for="s in donutSegments.segs" :key="s.key">
                      <circle cx="21" cy="21" r="15.9" fill="none" :stroke="s.color" stroke-width="6" :stroke-dasharray="s.dash" :stroke-dashoffset="s.offset" stroke-linecap="round"></circle>
                    </template>
                    <text x="21" y="20.5" text-anchor="middle" font-size="8" font-weight="800" fill="var(--color-text)" x-text="donutSegments.total"></text>
                    <text x="21" y="26" text-anchor="middle" font-size="3.4" fill="var(--color-text-muted)" x-text="t('dashboard.nb_vehicules')"></text>
                  </svg>
                  <div style="display: flex; flex-direction: column; gap: 9px; font-size: 12.5px;">
                    <div style="display: flex; align-items: center; gap: 8px;"><span style="width:9px;height:9px;border-radius:3px;background:#4f46e5;"></span><b x-text="data.flotte.disponible"></b>&nbsp;<span x-text="t('vehicules.statut.disponible').toLowerCase()"></span></div>
                    <div style="display: flex; align-items: center; gap: 8px;"><span style="width:9px;height:9px;border-radius:3px;background:#f59e0b;"></span><b x-text="data.flotte.loue"></b>&nbsp;<span x-text="t('vehicules.statut.loue').toLowerCase()"></span></div>
                    <div style="display: flex; align-items: center; gap: 8px;"><span style="width:9px;height:9px;border-radius:3px;background:#94a3b8;"></span><b x-text="data.flotte.maintenance"></b>&nbsp;<span x-text="t('vehicules.statut.maintenance').toLowerCase()"></span></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Row C : 7 prochains jours -->
            <div class="card" style="margin-bottom: var(--space-5);">
              <div class="flex-between" style="margin-bottom: 16px;">
                <span class="w-title" x-text="t('dashboard.prochains_jours')"></span>
                <span style="font-size: 12.5px; color: var(--color-text-muted);"
                  x-text="(() => { const n = data.prochains_jours.reduce((a, j) => a + j.reservations.length, 0); return n === 1 ? t('dashboard.reservations_a_venir_one') : t('dashboard.reservations_a_venir_many', { n }); })()"></span>
              </div>
              <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px;">
                <template x-for="j in data.prochains_jours" :key="j.date">
                  <div class="plan-col">
                    <div class="plan-day" x-text="jourCourt(j.date)"></div>
                    <template x-for="r in j.reservations" :key="r.id">
                      <div class="plan-item" x-text="`${r.vehicule} · ${r.nb_jours} ${t('dashboard.jour_abbr')}`"></div>
                    </template>
                  </div>
                </template>
              </div>
            </div>

            <!-- Row D : revenus sur l'année -->
            <div class="card">
              <div class="flex-between" style="margin-bottom: 16px;">
                <span class="w-title" x-text="t('dashboard.revenus_par_mois')"></span>
                <span style="font-size: 12.5px; color: var(--color-text-muted);" x-text="t('dashboard.revenus_12_mois')"></span>
              </div>
              <div style="height: 240px;"><canvas id="chart-revenus-annee"></canvas></div>
            </div>

          </div>
        </template>
      </div>
    </div>
  </div>

  <script src="/static/vendor/chartjs/chart.umd.js"></script>
  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components/sidebar.js"></script>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/auth-guard.js"></script>
  <script src="/static/js/licence-banner.js"></script>
  <script src="/static/js/pages/dashboard.js"></script>
</body>
</html>
