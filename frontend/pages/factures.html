<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factures — Krilia</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <script src="/static/i18n/fr.js"></script>
  <script src="/static/i18n/ar.js"></script>
  <script src="/static/js/i18n.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content">
      <div class="topbar">
        <h1 data-i18n="factures.title">Factures</h1>
        <div class="topbar-actions">
          <button class="lang-toggle" onclick="toggleLang()" data-i18n="lang.toggle">العربية</button>
          <button class="theme-toggle" onclick="toggleTheme()" data-i18n-aria="theme.toggle" aria-label="Changer de thème">
            <span id="theme-toggle-icon"></span>
          </button>
        </div>
      </div>

      <div class="page-content" x-data="facturesPage()" x-init="init()">
        <div class="flex-between mb-6" style="flex-wrap: wrap; gap: var(--space-3)">
          <div class="flex gap-3">
            <input
              class="input"
              style="max-width: 240px"
              type="search"
              data-i18n-ph="factures.search_ph"
              placeholder="Rechercher un numéro..."
              x-model="search"
              @input="onSearchInput()"
            />
            <select class="input" style="max-width: 200px" x-model="statutFilter" @change="loadFactures()">
              <option value="" x-text="t('common.all_statuses')">Tous les statuts</option>
              <option value="en_attente" x-text="t('factures.statut.en_attente')">En attente</option>
              <option value="payee" x-text="t('factures.statut.payee')">Payée</option>
              <option value="annulee" x-text="t('factures.statut.annulee')">Annulée</option>
            </select>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th data-i18n="factures.th_numero">Numéro</th>
                <th data-i18n="factures.th_client">Client</th>
                <th data-i18n="factures.th_vehicule">Véhicule</th>
                <th data-i18n="factures.th_emise">Émise le</th>
                <th data-i18n="factures.th_montant">Montant</th>
                <th data-i18n="factures.th_statut">Statut</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-if="loading">
                <tr>
                  <td colspan="7"><span class="spinner"></span></td>
                </tr>
              </template>
              <template x-if="!loading && factures.length === 0">
                <tr>
                  <td colspan="7" class="empty-state" x-text="t('factures.none')"></td>
                </tr>
              </template>
              <template x-for="f in factures" :key="f.id">
                <tr>
                  <td x-text="f.numero_facture"></td>
                  <td x-text="`${f.client.prenom} ${f.client.nom}`"></td>
                  <td x-text="`${f.vehicule.marque} ${f.vehicule.modele} (${f.vehicule.immatriculation})`"></td>
                  <td x-text="f.date_emission.slice(0, 10)"></td>
                  <td x-text="`${f.montant} MAD`"></td>
                  <td>
                    <span class="badge" :class="statutBadgeClass(f.statut_paiement)" x-text="statutLabel(f.statut_paiement)"></span>
                    <div class="text-secondary" style="font-size: var(--text-xs)" x-show="f.mode_paiement" x-text="modeLabel(f.mode_paiement)"></div>
                  </td>
                  <td>
                    <div class="flex gap-2" style="flex-wrap: wrap">
                      <button class="btn btn-secondary btn-sm" @click="downloadPdf(f)" :disabled="pdfLoadingId === f.id">
                        <span x-text="pdfLoadingId === f.id ? t('factures.pdf_loading') : t('factures.pdf')"></span>
                      </button>
                      <button class="btn btn-primary btn-sm" x-show="f.statut_paiement === 'en_attente'" @click="openPaiementModal(f)" x-text="t('factures.mark_paid')">
                      </button>
                      <button
                        class="btn btn-danger btn-sm"
                        x-show="['en_attente', 'payee'].includes(f.statut_paiement)"
                        @click="annulerFacture(f)"
                        x-text="t('factures.annuler')"
                      >
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="modal-overlay" x-show="paiementModalOpen" x-cloak @click.self="closePaiementModal()">
          <div class="modal" style="max-width: 380px">
            <div class="modal-header">
              <h2 x-text="t('factures.modal_paiement')"></h2>
              <button class="btn btn-ghost btn-icon" type="button" @click="closePaiementModal()">✕</button>
            </div>

            <p class="text-secondary mb-4" style="font-size: var(--text-sm)" x-text="payingFacture ? t('factures.facture_montant', { num: payingFacture.numero_facture, montant: payingFacture.montant }) : ''"></p>

            <template x-if="paiementError">
              <div
                style="background: var(--color-danger-bg); color: var(--color-danger); padding: var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-4); font-size: var(--text-sm);"
                x-text="paiementError"
              ></div>
            </template>

            <form @submit.prevent="confirmPaiement()">
              <div class="form-group">
                <label x-text="t('factures.f_mode')"></label>
                <select class="input" x-model="modePaiement" required>
                  <option value="" x-text="t('common.select')">Sélectionner...</option>
                  <option value="especes" x-text="t('factures.mode.especes')">Espèces</option>
                  <option value="carte" x-text="t('factures.mode.carte')">Carte</option>
                  <option value="virement" x-text="t('factures.mode.virement')">Virement</option>
                  <option value="cheque" x-text="t('factures.mode.cheque')">Chèque</option>
                </select>
              </div>

              <div class="modal-actions">
                <button type="button" class="btn btn-secondary" @click="closePaiementModal()" x-text="t('common.cancel')"></button>
                <button type="submit" class="btn btn-primary" :disabled="saving">
                  <span x-text="saving ? t('common.saving') : t('factures.confirmer_paiement')"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components/sidebar.js"></script>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/auth-guard.js"></script>
  <script src="/static/js/licence-banner.js"></script>
  <script src="/static/js/download.js"></script>
  <script src="/static/js/pages/factures.js"></script>
</body>
</html>
