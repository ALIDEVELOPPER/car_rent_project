<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Véhicules — Krilia</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <script src="/static/i18n/fr.js"></script>
  <script src="/static/i18n/ar.js"></script>
  <script src="/static/js/i18n.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content">
      <div class="topbar">
        <h1 data-i18n="vehicules.title">Véhicules</h1>
        <div class="topbar-actions">
          <button class="lang-toggle" onclick="toggleLang()" data-i18n="lang.toggle">العربية</button>
          <button class="theme-toggle" onclick="toggleTheme()" data-i18n-aria="theme.toggle" aria-label="Changer de thème">
            <span id="theme-toggle-icon"></span>
          </button>
        </div>
      </div>

      <div class="page-content" x-data="vehiculesPage()" x-init="init()">
        <div class="flex-between mb-6" style="flex-wrap: wrap; gap: var(--space-3)">
          <div class="flex gap-3">
            <input
              class="input"
              style="max-width: 280px"
              type="search"
              data-i18n-ph="vehicules.search_ph"
              placeholder="Rechercher un véhicule..."
              x-model="search"
              @input="onSearchInput()"
            />
            <select class="input" style="max-width: 200px" x-model="statutFilter" @change="loadVehicules()">
              <option value="" x-text="t('common.all_statuses')">Tous les statuts</option>
              <option value="disponible" x-text="t('vehicules.statut.disponible')">Disponible</option>
              <option value="loue" x-text="t('vehicules.statut.loue')">Loué</option>
              <option value="maintenance" x-text="t('vehicules.statut.maintenance')">Maintenance</option>
              <option value="hors_service" x-text="t('vehicules.statut.hors_service')">Hors service</option>
            </select>
          </div>
          <button class="btn btn-primary" @click="openCreate()" data-i18n="vehicules.new">+ Nouveau véhicule</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th data-i18n="vehicules.th_vehicule">Véhicule</th>
                <th data-i18n="vehicules.th_immat">Immatriculation</th>
                <th data-i18n="vehicules.th_categorie">Catégorie</th>
                <th data-i18n="vehicules.th_tarif">Tarif / jour</th>
                <th data-i18n="vehicules.th_statut">Statut</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-if="loading">
                <tr>
                  <td colspan="6"><span class="spinner"></span></td>
                </tr>
              </template>
              <template x-if="!loading && vehicules.length === 0">
                <tr>
                  <td colspan="6" class="empty-state" x-text="t('vehicules.none')"></td>
                </tr>
              </template>
              <template x-for="v in vehicules" :key="v.id">
                <tr>
                  <td>
                    <div class="flex gap-3" style="align-items: center">
                      <img
                        x-show="v.photo_url"
                        :src="'/api/uploads/' + v.photo_url"
                        style="width: 40px; height: 40px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0"
                      />
                      <span x-text="`${v.marque} ${v.modele}`"></span>
                    </div>
                  </td>
                  <td x-text="v.immatriculation"></td>
                  <td x-text="v.categorie"></td>
                  <td x-text="`${v.tarif_jour} MAD`"></td>
                  <td>
                    <span class="badge" :class="statutBadgeClass(v.statut)" x-text="statutLabel(v.statut)"></span>
                  </td>
                  <td>
                    <div class="flex gap-2">
                      <button class="btn btn-secondary btn-sm" @click="openEdit(v)" x-text="t('common.edit')"></button>
                      <button class="btn btn-danger btn-sm" x-show="isAdmin()" @click="deleteVehicule(v)" x-text="t('common.delete')"></button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="modal-overlay" x-show="modalOpen" x-cloak @click.self="closeModal()">
          <div class="modal">
            <div class="modal-header">
              <h2 x-text="editing ? t('vehicules.modal_edit') : t('vehicules.modal_new')"></h2>
              <button class="btn btn-ghost btn-icon" type="button" @click="closeModal()">✕</button>
            </div>

            <template x-if="formError">
              <div
                style="background: var(--color-danger-bg); color: var(--color-danger); padding: var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-4); font-size: var(--text-sm);"
                x-text="formError"
              ></div>
            </template>

            <form @submit.prevent="submitForm()">
              <div class="form-row">
                <div class="form-group">
                  <label data-i18n="vehicules.f_marque">Marque</label>
                  <input class="input" x-model="form.marque" required />
                </div>
                <div class="form-group">
                  <label data-i18n="vehicules.f_modele">Modèle</label>
                  <input class="input" x-model="form.modele" required />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label data-i18n="vehicules.f_immat">Immatriculation</label>
                  <input class="input" x-model="form.immatriculation" required />
                </div>
                <div class="form-group">
                  <label data-i18n="vehicules.f_categorie">Catégorie</label>
                  <input class="input" list="categories" x-model="form.categorie" required />
                  <datalist id="categories">
                    <option value="citadine"></option>
                    <option value="berline"></option>
                    <option value="SUV"></option>
                    <option value="monospace"></option>
                    <option value="utilitaire"></option>
                  </datalist>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label data-i18n="vehicules.f_annee">Année</label>
                  <input class="input" type="number" min="1990" max="2100" x-model="form.annee" />
                </div>
                <div class="form-group">
                  <label data-i18n="vehicules.f_couleur">Couleur</label>
                  <input class="input" x-model="form.couleur" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label data-i18n="vehicules.f_km">Kilométrage</label>
                  <input class="input" type="number" min="0" x-model="form.kilometrage" />
                </div>
                <div class="form-group">
                  <label data-i18n="vehicules.f_tarif">Tarif journalier (MAD)</label>
                  <input class="input" type="number" min="0.01" step="0.01" x-model="form.tarif_jour" required />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label data-i18n="vehicules.f_carburant">Carburant</label>
                  <select class="input" x-model="form.carburant">
                    <option value="">—</option>
                    <option value="essence" x-text="t('vehicules.carburant.essence')">Essence</option>
                    <option value="diesel" x-text="t('vehicules.carburant.diesel')">Diesel</option>
                    <option value="hybride" x-text="t('vehicules.carburant.hybride')">Hybride</option>
                    <option value="electrique" x-text="t('vehicules.carburant.electrique')">Électrique</option>
                  </select>
                </div>
                <div class="form-group">
                  <label data-i18n="vehicules.f_transmission">Transmission</label>
                  <select class="input" x-model="form.transmission">
                    <option value="">—</option>
                    <option value="manuelle" x-text="t('vehicules.transmission.manuelle')">Manuelle</option>
                    <option value="automatique" x-text="t('vehicules.transmission.automatique')">Automatique</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label data-i18n="vehicules.f_statut">Statut</label>
                <select class="input" x-model="form.statut">
                  <option value="disponible" x-text="t('vehicules.statut.disponible')">Disponible</option>
                  <option value="loue" x-text="t('vehicules.statut.loue')">Loué</option>
                  <option value="maintenance" x-text="t('vehicules.statut.maintenance')">Maintenance</option>
                  <option value="hors_service" x-text="t('vehicules.statut.hors_service')">Hors service</option>
                </select>
              </div>

              <div class="card-title" style="margin: var(--space-4) 0 var(--space-2); font-size: var(--text-sm);" x-text="t('vehicules.section_echeances')"></div>
              <div class="form-row">
                <div class="form-group"><label x-text="t('vehicules.f_assurance')"></label><input class="input" type="date" x-model="form.assurance_expire_le" /></div>
                <div class="form-group"><label x-text="t('vehicules.f_visite')"></label><input class="input" type="date" x-model="form.visite_technique_expire_le" /></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label x-text="t('vehicules.f_vignette')"></label><input class="input" type="date" x-model="form.vignette_expire_le" /></div>
                <div class="form-group"><label x-text="t('vehicules.f_vidange')"></label><input class="input" type="date" x-model="form.prochaine_vidange_le" /></div>
              </div>
              <div class="form-group">
                <label x-text="t('vehicules.f_vidange_km')"></label>
                <input class="input" type="number" min="0" x-model="form.prochaine_vidange_km" />
              </div>

              <template x-if="editing">
                <div class="form-group">
                  <label x-text="t('vehicules.f_photo')">Photo</label>
                  <div class="flex gap-3" style="align-items: center">
                    <img
                      x-show="editing.photo_url"
                      :src="'/api/uploads/' + editing.photo_url"
                      style="width: 56px; height: 56px; border-radius: var(--radius-sm); object-fit: cover"
                    />
                    <input type="file" accept=".jpg,.jpeg,.png,.webp" @change="uploadPhoto(editing, $event.target)" />
                  </div>
                </div>
              </template>

              <template x-if="editing">
                <div style="margin-top: var(--space-5); padding-top: var(--space-4); border-top: 1px solid var(--color-border);">
                  <div class="card-title" style="margin-bottom: 2px; font-size: var(--text-sm);" x-text="t('vehicules.section_depenses')"></div>
                  <p class="text-secondary" style="font-size: var(--text-xs); margin-bottom: var(--space-3);" x-text="t('vehicules.depenses_hint')"></p>

                  <div x-show="depenses.length" style="margin-bottom: var(--space-3);">
                    <template x-for="d in depenses" :key="d.id">
                      <div class="flex-between" style="padding: 6px 0; border-bottom: 1px solid var(--color-border); font-size: 13px; gap: 10px;">
                        <span style="min-width:0;">
                          <b x-text="t('vehicules.type_depense.' + d.type)"></b>
                          <span class="text-secondary" x-text="' · ' + d.date_depense"></span>
                          <span x-show="d.note" class="text-secondary" x-text="' — ' + d.note"></span>
                        </span>
                        <span style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
                          <b x-text="d.montant + ' MAD'"></b>
                          <button type="button" class="btn btn-ghost btn-icon btn-sm" @click="supprimerDepense(d.id)">✕</button>
                        </span>
                      </div>
                    </template>
                    <div class="flex-between" style="padding-top: 8px; font-weight: 800; font-size: 13px;">
                      <span x-text="t('vehicules.dep_total')"></span><span x-text="depensesTotal + ' MAD'"></span>
                    </div>
                  </div>
                  <p x-show="!depenses.length" class="text-secondary" style="font-size: 13px; margin-bottom: var(--space-3);" x-text="t('vehicules.dep_aucune')"></p>

                  <div class="form-row">
                    <div class="form-group">
                      <label x-text="t('vehicules.f_dep_type')"></label>
                      <select class="input" x-model="depenseForm.type">
                        <template x-for="ty in ['achat', 'assurance', 'entretien', 'reparation', 'credit', 'autre']" :key="ty">
                          <option :value="ty" x-text="t('vehicules.type_depense.' + ty)"></option>
                        </template>
                      </select>
                    </div>
                    <div class="form-group">
                      <label x-text="t('vehicules.f_dep_montant')"></label>
                      <input class="input" type="number" min="0" step="0.01" x-model="depenseForm.montant" />
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label x-text="t('vehicules.f_dep_date')"></label>
                      <input class="input" type="date" x-model="depenseForm.date_depense" />
                    </div>
                    <div class="form-group">
                      <label x-text="t('vehicules.f_dep_note')"></label>
                      <input class="input" x-model="depenseForm.note" />
                    </div>
                  </div>
                  <button type="button" class="btn btn-secondary btn-sm" :disabled="depenseSaving" @click="ajouterDepense()" x-text="t('vehicules.dep_ajouter')"></button>
                </div>
              </template>

              <div class="modal-actions">
                <button type="button" class="btn btn-secondary" @click="closeModal()" x-text="t('common.cancel')"></button>
                <button type="submit" class="btn btn-primary" :disabled="saving">
                  <span x-text="saving ? t('common.saving') : t('common.save')"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components/sidebar.js"></script>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/auth-guard.js"></script>
  <script src="/static/js/licence-banner.js"></script>
  <script src="/static/js/pages/vehicules.js"></script>
</body>
</html>
