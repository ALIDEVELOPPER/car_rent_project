<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Krilia</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <script src="/static/i18n/fr.js"></script>
  <script src="/static/i18n/ar.js"></script>
  <script src="/static/js/i18n.js"></script>
  <style>
    .auth { display: flex; min-height: 100vh; }
    .auth-brand {
      position: relative; width: 44%; max-width: 560px; overflow: hidden; color: #fff;
      padding: 56px; display: flex; flex-direction: column; justify-content: space-between;
      background: linear-gradient(150deg, #4f46e5 0%, #6d28d9 55%, #7c3aed 100%);
    }
    .auth-brand .blob { position: absolute; border-radius: 50%; }
    .auth-brand .blob1 { width: 520px; height: 520px; right: -220px; top: -160px; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%); }
    .auth-brand .blob2 { width: 360px; height: 360px; left: -160px; bottom: -140px; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.14), rgba(255,255,255,0) 62%); }
    .auth-brand .logo { display: flex; align-items: center; gap: 12px; position: relative; }
    .auth-brand .logo .mark { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
    .auth-brand h1 { margin: 0 0 14px; font-size: 32px; line-height: 1.22; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; color: #fff; }
    .auth-brand p { margin: 0; font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.82); max-width: 380px; }
    .auth-brand .stats { display: flex; gap: 28px; position: relative; font-size: 13px; color: rgba(255,255,255,.72); }
    .auth-brand .stats b { display: block; font-size: 20px; font-weight: 800; color: #fff; }
    .auth-form { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; background: var(--color-bg); position: relative; }
    .auth-form .toggles { position: absolute; top: 26px; right: 28px; display: flex; gap: 8px; }
    .auth-card { width: 100%; max-width: 380px; }
    .auth-card h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 6px; }
    .auth-card .sub { color: var(--color-text-secondary); font-size: 14px; margin: 0 0 28px; }
    .login-error { background: var(--color-danger-bg); color: var(--color-danger); border-radius: var(--radius-md); padding: 12px 14px; font-size: 13px; font-weight: 500; margin-bottom: 16px; }
    @media (max-width: 820px) { .auth-brand { display: none; } }
    [dir="rtl"] .auth-form .toggles { right: auto; left: 28px; }
  </style>
</head>
<body>
  <div class="auth" x-data="loginForm()">
    <aside class="auth-brand">
      <span class="blob blob1"></span><span class="blob blob2"></span>
      <div class="logo"><span class="mark">K</span><span style="font-weight:700; font-size:18px;">Krilia</span></div>
      <div style="position: relative;">
        <h1 data-i18n="login.brand_title">La gestion de votre agence de location, simplifiée.</h1>
        <p data-i18n="login.brand_sub">Clients, flotte, réservations, contrats et factures — en français comme en arabe, même hors connexion.</p>
      </div>
      <div class="stats">
        <div><b>100%</b><span data-i18n="login.stat_local">local &amp; privé</span></div>
        <div><b>7 j</b><span data-i18n="login.stat_trial">d'essai gratuit</span></div>
        <div><b>FR / ع</b><span data-i18n="login.stat_bi">bilingue</span></div>
      </div>
    </aside>

    <div class="auth-form">
      <div class="toggles">
        <button class="lang-toggle" onclick="toggleLang()" data-i18n="lang.toggle">العربية</button>
        <button class="theme-toggle" onclick="toggleTheme()" data-i18n-aria="theme.toggle" aria-label="Changer de thème"><span id="theme-toggle-icon"></span></button>
      </div>

      <div class="auth-card">
        <h2 data-i18n="login.title">Connexion</h2>
        <p class="sub" data-i18n="login.subtitle">Accédez à l'espace de votre agence.</p>

        <template x-if="error"><div class="login-error" x-text="error"></div></template>

        <form onsubmit="return false" @submit.prevent="submit">
          <div class="form-group">
            <label for="email" data-i18n="login.email">Email</label>
            <input class="input" type="email" id="email" x-model="email" required autofocus />
          </div>
          <div class="form-group">
            <label for="password" data-i18n="login.password">Mot de passe</label>
            <input class="input" type="password" id="password" x-model="motDePasse" required />
          </div>
          <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 4px;" :disabled="loading">
            <span class="spinner" x-show="loading" style="border-top-color: #fff"></span>
            <span x-text="loading ? t('login.submitting') : t('login.submit')"></span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/pages/login.js"></script>
</body>
</html>
