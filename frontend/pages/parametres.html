<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paramètres — Krilia</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <script src="/static/i18n/fr.js"></script>
  <script src="/static/i18n/ar.js"></script>
  <script src="/static/js/i18n.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content">
      <div class="topbar">
        <h1 data-i18n="parametres.title">Paramètres</h1>
        <div class="topbar-actions">
          <button class="lang-toggle" onclick="toggleLang()" data-i18n="lang.toggle">العربية</button>
          <button class="theme-toggle" onclick="toggleTheme()" data-i18n-aria="theme.toggle" aria-label="Changer de thème">
            <span id="theme-toggle-icon"></span>
          </button>
        </div>
      </div>

      <div class="page-content" x-data="parametresPage()" x-init="init()">
        <template x-if="loading">
          <div class="flex" style="justify-content: center; padding: var(--space-10)"><span class="spinner"></span></div>
        </template>

        <template x-if="!loading && accessDenied">
          <div class="empty-state" x-text="t('parametres.access_denied')"></div>
        </template>

        <template x-if="!loading && !accessDenied">
          <div>
            <div class="card mb-6">
              <div class="card-title" x-text="t('parametres.agence_infos')"></div>

              <template x-if="agenceError">
                <div
                  style="background: var(--color-danger-bg); color: var(--color-danger); padding: var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-4); font-size: var(--text-sm);"
                  x-text="agenceError"
                ></div>
              </template>

              <div class="flex gap-4 mb-6" style="align-items: center">
                <img
                  x-show="agence && agence.logo_url"
                  :src="agence ? '/api/uploads/' + agence.logo_url : ''"
                  style="width: 64px; height: 64px; border-radius: var(--radius-md); object-fit: cover; border: 1px solid var(--color-border)"
                />
                <div
                  x-show="!agence || !agence.logo_url"
                  style="width: 64px; height: 64px; border-radius: var(--radius-md); background: var(--color-surface-alt); border: 1px solid var(--color-border)"
                ></div>
                <div>
                  <label style="display: block; margin-bottom: var(--space-2)" x-text="t('parametres.f_logo')"></label>
                  <input type="file" accept=".jpg,.jpeg,.png,.webp" @change="uploadLogo($event.target)" />
                </div>
              </div>

              <form @submit.prevent="saveAgence()">
                <div class="form-group">
                  <label x-text="t('parametres.f_nom')"></label>
                  <input class="input" x-model="agenceForm.nom" required />
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label x-text="t('parametres.f_tel')"></label>
                    <input class="input" x-model="agenceForm.telephone" />
                  </div>
                  <div class="form-group">
                    <label x-text="t('parametres.f_email')"></label>
                    <input class="input" type="email" x-model="agenceForm.email" />
                  </div>
                </div>
                <div class="form-group">
                  <label x-text="t('parametres.f_adresse')"></label>
                  <input class="input" x-model="agenceForm.adresse" />
                </div>
                <div class="form-group">
                  <label x-text="t('parametres.f_langue')"></label>
                  <select class="input" x-model="agenceForm.langue" @change="setLang(agenceForm.langue)">
                    <option value="fr" x-text="t('lang.fr')">Français</option>
                    <option value="ar" x-text="t('lang.ar')">العربية</option>
                  </select>
                </div>

                <div class="card-title" style="margin: var(--space-4) 0 0; font-size: var(--text-sm);" x-text="t('parametres.section_legal')"></div>
                <div class="form-row">
                  <div class="form-group"><label>ICE</label><input class="input" x-model="agenceForm.ice" /></div>
                  <div class="form-group"><label>RC</label><input class="input" x-model="agenceForm.rc" /></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label x-text="t('parametres.f_if')"></label><input class="input" x-model="agenceForm.identifiant_fiscal" /></div>
                  <div class="form-group"><label x-text="t('parametres.f_patente')"></label><input class="input" x-model="agenceForm.patente" /></div>
                </div>
                <div class="form-row" style="align-items: end;">
                  <div class="form-group">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                      <input type="checkbox" x-model="agenceForm.tva_applicable" style="width:auto; min-height:0;" />
                      <span x-text="t('parametres.f_tva_applicable')"></span>
                    </label>
                  </div>
                  <div class="form-group" x-show="agenceForm.tva_applicable">
                    <label x-text="t('parametres.f_taux_tva')"></label>
                    <input class="input" type="number" min="0" max="100" step="0.1" x-model="agenceForm.taux_tva" />
                  </div>
                </div>

                <div class="form-group" style="margin-top: var(--space-4);">
                  <label x-text="t('parametres.f_mentions')"></label>
                  <textarea class="input" rows="2" x-model="agenceForm.mentions_legales"></textarea>
                </div>
                <div class="form-group">
                  <label x-text="t('parametres.f_conditions')"></label>
                  <textarea class="input" rows="6" x-model="agenceForm.conditions_contrat" :placeholder="t('parametres.conditions_ph')"></textarea>
                </div>
                <div class="flex" style="justify-content: flex-end">
                  <button type="submit" class="btn btn-primary" :disabled="agenceSaving">
                    <span x-text="agenceSaving ? t('common.saving') : t('common.save')"></span>
                  </button>
                </div>
              </form>
            </div>

            <div class="card mb-6">
              <div class="card-title" x-text="t('parametres.import_section')"></div>
              <p class="text-secondary" style="font-size: var(--text-sm); margin-bottom: var(--space-4);" x-text="t('parametres.import_hint')"></p>
              <div class="form-row">
                <div class="form-group">
                  <label x-text="t('nav.vehicules')"></label>
                  <input type="file" accept=".xlsx" @change="importer('vehicules', $event.target)" :disabled="importing" />
                  <a href="/api/import/modele/vehicules" style="font-size: var(--text-xs); margin-top: 4px;" x-text="t('parametres.import_modele')"></a>
                </div>
                <div class="form-group">
                  <label x-text="t('nav.clients')"></label>
                  <input type="file" accept=".xlsx" @change="importer('clients', $event.target)" :disabled="importing" />
                  <a href="/api/import/modele/clients" style="font-size: var(--text-xs); margin-top: 4px;" x-text="t('parametres.import_modele')"></a>
                </div>
              </div>
              <template x-if="importResult">
                <div style="margin-top: var(--space-3); padding: var(--space-3); border-radius: var(--radius-sm); background: var(--color-surface-alt); font-size: var(--text-sm);">
                  <div><b x-text="importResult.cree"></b> <span x-text="t('parametres.import_crees')"></span><span x-show="importResult.ignore"> · <b x-text="importResult.ignore"></b> <span x-text="t('parametres.import_ignores')"></span></span></div>
                  <template x-if="importResult.erreurs && importResult.erreurs.length">
                    <ul style="margin: var(--space-2) 0 0; padding-left: 1.1em; color: var(--color-danger); font-size: var(--text-xs);">
                      <template x-for="e in importResult.erreurs" :key="e"><li x-text="e"></li></template>
                    </ul>
                  </template>
                </div>
              </template>
            </div>

            <div class="card mb-6">
              <div class="card-title" x-text="t('parametres.backup_section')"></div>
              <p class="text-secondary" style="font-size: var(--text-sm); margin-bottom: var(--space-4);" x-text="t('parametres.backup_hint')"></p>
              <div class="form-row" style="align-items: end;">
                <div class="form-group">
                  <label x-text="t('parametres.backup_password')"></label>
                  <input class="input" type="password" x-model="backupPassword" :placeholder="t('parametres.backup_password_ph')" />
                </div>
                <div class="form-group">
                  <button type="button" class="btn btn-primary" @click="creerSauvegarde()" :disabled="backupBusy">
                    <span x-text="backupBusy ? t('common.saving') : t('parametres.backup_create')"></span>
                  </button>
                </div>
              </div>

              <div style="border-top: 1px solid var(--color-border); margin: var(--space-4) 0; padding-top: var(--space-4);">
                <label style="font-weight: 700;" x-text="t('parametres.restore_title')"></label>
                <p class="text-secondary" style="font-size: var(--text-xs); margin: 4px 0 var(--space-3);" x-text="t('parametres.restore_warn')"></p>
                <div class="form-row" style="align-items: end;">
                  <div class="form-group">
                    <label x-text="t('parametres.backup_password')"></label>
                    <input class="input" type="password" x-model="restorePassword" />
                  </div>
                  <div class="form-group">
                    <input type="file" accept=".zip" @change="restaurer($event.target)" :disabled="backupBusy" />
                  </div>
                </div>
                <template x-if="restoreDone">
                  <div style="margin-top: var(--space-2); padding: var(--space-3); border-radius: var(--radius-sm); background: var(--color-success-bg); color: var(--color-success); font-size: var(--text-sm); font-weight: 600;" x-text="t('parametres.restore_ok')"></div>
                </template>
              </div>
            </div>

            <div class="card">
              <div class="card-title" x-text="t('parametres.password_section')"></div>
              <template x-if="passwordError">
                <div
                  style="background: var(--color-danger-bg); color: var(--color-danger); padding: var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-4); font-size: var(--text-sm);"
                  x-text="passwordError"
                ></div>
              </template>
              <form @submit.prevent="changePassword()">
                <div class="form-group">
                  <label x-text="t('parametres.f_new_password')"></label>
                  <input class="input" type="password" x-model="passwordForm.mot_de_passe" minlength="8" required />
                </div>
                <div class="flex" style="justify-content: flex-end">
                  <button type="submit" class="btn btn-primary" :disabled="passwordSaving">
                    <span x-text="passwordSaving ? t('common.saving') : t('parametres.change_password')"></span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components/sidebar.js"></script>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/auth-guard.js"></script>
  <script src="/static/js/licence-banner.js"></script>
  <script src="/static/js/download.js"></script>
  <script src="/static/js/pages/parametres.js"></script>
</body>
</html>
