<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clients — Krilia</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <script src="/static/i18n/fr.js"></script>
  <script src="/static/i18n/ar.js"></script>
  <script src="/static/js/i18n.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content">
      <div class="topbar">
        <h1 data-i18n="clients.title">Clients</h1>
        <div class="topbar-actions">
          <button class="lang-toggle" onclick="toggleLang()" data-i18n="lang.toggle">العربية</button>
          <button class="theme-toggle" onclick="toggleTheme()" data-i18n-aria="theme.toggle" aria-label="Changer de thème">
            <span id="theme-toggle-icon"></span>
          </button>
        </div>
      </div>

      <div class="page-content" x-data="clientsPage()" x-init="init()">
        <div class="flex-between mb-6">
          <input
            class="input"
            style="max-width: 320px"
            type="search"
            data-i18n-ph="clients.search_ph"
            placeholder="Rechercher un client..."
            x-model="search"
            @input="onSearchInput()"
          />
          <button class="btn btn-primary" @click="openCreate()" data-i18n="clients.new">+ Nouveau client</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th data-i18n="clients.th_nom">Nom</th>
                <th data-i18n="clients.th_tel">Téléphone</th>
                <th data-i18n="clients.th_email">Email</th>
                <th data-i18n="clients.th_piece">Pièce d'identité</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-if="loading">
                <tr>
                  <td colspan="5"><span class="spinner"></span></td>
                </tr>
              </template>
              <template x-if="!loading && clients.length === 0">
                <tr>
                  <td colspan="5" class="empty-state" x-text="t('clients.none')"></td>
                </tr>
              </template>
              <template x-for="c in clients" :key="c.id">
                <tr>
                  <td x-text="`${c.prenom} ${c.nom}`"></td>
                  <td x-text="c.telephone"></td>
                  <td x-text="c.email || '—'"></td>
                  <td>
                    <span class="badge badge-info" x-show="c.numero_piece_identite" x-text="c.numero_piece_identite"></span>
                    <span class="text-secondary" x-show="!c.numero_piece_identite">—</span>
                  </td>
                  <td>
                    <div class="flex gap-2">
                      <button class="btn btn-secondary btn-sm" @click="openEdit(c)" x-text="t('common.edit')"></button>
                      <button class="btn btn-danger btn-sm" x-show="isAdmin()" @click="deleteClient(c)" x-text="t('common.delete')"></button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="modal-overlay" x-show="modalOpen" x-cloak @click.self="closeModal()">
          <div class="modal">
            <div class="modal-header">
              <h2 x-text="editing ? t('clients.modal_edit') : t('clients.modal_new')"></h2>
              <button class="btn btn-ghost btn-icon" type="button" @click="closeModal()">✕</button>
            </div>

            <template x-if="formError">
              <div
                style="background: var(--color-danger-bg); color: var(--color-danger); padding: var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-4); font-size: var(--text-sm);"
                x-text="formError"
              ></div>
            </template>

            <form @submit.prevent="submitForm()">
              <div class="form-row">
                <div class="form-group">
                  <label data-i18n="clients.f_nom">Nom</label>
                  <input class="input" x-model="form.nom" required />
                </div>
                <div class="form-group">
                  <label data-i18n="clients.f_prenom">Prénom</label>
                  <input class="input" x-model="form.prenom" required />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label data-i18n="clients.f_tel">Téléphone</label>
                  <input class="input" x-model="form.telephone" required />
                </div>
                <div class="form-group">
                  <label data-i18n="clients.f_email">Email</label>
                  <input class="input" type="email" x-model="form.email" />
                </div>
              </div>
              <div class="form-group">
                <label data-i18n="clients.f_adresse">Adresse</label>
                <input class="input" x-model="form.adresse" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label data-i18n="clients.f_naissance">Date de naissance</label>
                  <input class="input" type="date" x-model="form.date_naissance" />
                </div>
                <div class="form-group">
                  <label data-i18n="clients.f_type_piece">Type de pièce</label>
                  <select class="input" x-model="form.type_piece_identite">
                    <option value="">—</option>
                    <option value="cni" x-text="t('clients.piece_cni')">CNI</option>
                    <option value="passeport" x-text="t('clients.piece_passeport')">Passeport</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label data-i18n="clients.f_num_piece">Numéro de pièce d'identité</label>
                <input class="input" x-model="form.numero_piece_identite" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label data-i18n="clients.f_num_permis">Numéro de permis de conduire</label>
                  <input class="input" x-model="form.numero_permis" />
                </div>
                <div class="form-group">
                  <label data-i18n="clients.f_date_permis">Permis délivré le</label>
                  <input class="input" type="date" x-model="form.date_delivrance_permis" />
                </div>
              </div>

              <template x-if="editing">
                <div class="form-group">
                  <label x-text="t('clients.documents')"></label>
                  <div class="flex gap-3" style="align-items: center; margin-bottom: var(--space-2)">
                    <span
                      class="text-secondary"
                      style="font-size: var(--text-sm); min-width: 160px"
                      x-text="editing.document_identite_url ? t('clients.piece_envoyee') : t('clients.piece_aucune')"
                    ></span>
                    <input type="file" accept=".pdf,.jpg,.jpeg,.png" @change="uploadDocument(editing, 'identite', $event.target)" />
                  </div>
                  <div class="flex gap-3" style="align-items: center">
                    <span
                      class="text-secondary"
                      style="font-size: var(--text-sm); min-width: 160px"
                      x-text="editing.permis_url ? t('clients.permis_envoye') : t('clients.permis_aucun')"
                    ></span>
                    <input type="file" accept=".pdf,.jpg,.jpeg,.png" @change="uploadDocument(editing, 'permis', $event.target)" />
                  </div>
                </div>
              </template>

              <div class="modal-actions">
                <button type="button" class="btn btn-secondary" @click="closeModal()" x-text="t('common.cancel')"></button>
                <button type="submit" class="btn btn-primary" :disabled="saving">
                  <span x-text="saving ? t('common.saving') : t('common.save')"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components/sidebar.js"></script>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/auth-guard.js"></script>
  <script src="/static/js/licence-banner.js"></script>
  <script src="/static/js/pages/clients.js"></script>
</body>
</html>
