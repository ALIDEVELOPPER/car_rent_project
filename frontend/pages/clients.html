<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clients — Agence Location</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/js/theme.js"></script>
  <script src="/static/i18n/fr.js"></script>
  <script src="/static/i18n/ar.js"></script>
  <script src="/static/js/i18n.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content">
      <div class="topbar">
        <h1>Clients</h1>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer de thème">
          <span id="theme-toggle-icon"></span>
        </button>
      </div>

      <div class="page-content" x-data="clientsPage()" x-init="init()">
        <div class="flex-between mb-6">
          <input
            class="input"
            style="max-width: 320px"
            type="search"
            placeholder="Rechercher un client..."
            x-model="search"
            @input="onSearchInput()"
          />
          <button class="btn btn-primary" @click="openCreate()">+ Nouveau client</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Email</th>
                <th>Pièce d'identité</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-if="loading">
                <tr>
                  <td colspan="5"><span class="spinner"></span></td>
                </tr>
              </template>
              <template x-if="!loading && clients.length === 0">
                <tr>
                  <td colspan="5" class="empty-state">Aucun client trouvé.</td>
                </tr>
              </template>
              <template x-for="c in clients" :key="c.id">
                <tr>
                  <td x-text="`${c.prenom} ${c.nom}`"></td>
                  <td x-text="c.telephone"></td>
                  <td x-text="c.email || '—'"></td>
                  <td>
                    <span class="badge badge-info" x-show="c.numero_piece_identite" x-text="c.numero_piece_identite"></span>
                    <span class="text-secondary" x-show="!c.numero_piece_identite">—</span>
                  </td>
                  <td>
                    <div class="flex gap-2">
                      <button class="btn btn-secondary btn-sm" @click="openEdit(c)">Modifier</button>
                      <button class="btn btn-danger btn-sm" x-show="isAdmin()" @click="deleteClient(c)">Supprimer</button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="modal-overlay" x-show="modalOpen" x-cloak @click.self="closeModal()">
          <div class="modal">
            <div class="modal-header">
              <h2 x-text="editing ? 'Modifier le client' : 'Nouveau client'"></h2>
              <button class="btn btn-ghost btn-icon" type="button" @click="closeModal()">✕</button>
            </div>

            <template x-if="formError">
              <div
                style="background: var(--color-danger-bg); color: var(--color-danger); padding: var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-4); font-size: var(--text-sm);"
                x-text="formError"
              ></div>
            </template>

            <form @submit.prevent="submitForm()">
              <div class="form-row">
                <div class="form-group">
                  <label>Nom</label>
                  <input class="input" x-model="form.nom" required />
                </div>
                <div class="form-group">
                  <label>Prénom</label>
                  <input class="input" x-model="form.prenom" required />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Téléphone</label>
                  <input class="input" x-model="form.telephone" required />
                </div>
                <div class="form-group">
                  <label>Email</label>
                  <input class="input" type="email" x-model="form.email" />
                </div>
              </div>
              <div class="form-group">
                <label>Adresse</label>
                <input class="input" x-model="form.adresse" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Date de naissance</label>
                  <input class="input" type="date" x-model="form.date_naissance" />
                </div>
                <div class="form-group">
                  <label>Type de pièce</label>
                  <select class="input" x-model="form.type_piece_identite">
                    <option value="">—</option>
                    <option value="cni">CNI</option>
                    <option value="passeport">Passeport</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label>Numéro de pièce d'identité</label>
                <input class="input" x-model="form.numero_piece_identite" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Numéro de permis de conduire</label>
                  <input class="input" x-model="form.numero_permis" />
                </div>
                <div class="form-group">
                  <label>Permis délivré le</label>
                  <input class="input" type="date" x-model="form.date_delivrance_permis" />
                </div>
              </div>

              <template x-if="editing">
                <div class="form-group">
                  <label>Documents</label>
                  <div class="flex gap-3" style="align-items: center; margin-bottom: var(--space-2)">
                    <span
                      class="text-secondary"
                      style="font-size: var(--text-sm); min-width: 160px"
                      x-text="editing.document_identite_url ? 'Pièce d\'identité envoyée' : 'Pièce d\'identité : aucune'"
                    ></span>
                    <input type="file" accept=".pdf,.jpg,.jpeg,.png" @change="uploadDocument(editing, 'identite', $event.target)" />
                  </div>
                  <div class="flex gap-3" style="align-items: center">
                    <span
                      class="text-secondary"
                      style="font-size: var(--text-sm); min-width: 160px"
                      x-text="editing.permis_url ? 'Permis envoyé' : 'Permis : aucun'"
                    ></span>
                    <input type="file" accept=".pdf,.jpg,.jpeg,.png" @change="uploadDocument(editing, 'permis', $event.target)" />
                  </div>
                </div>
              </template>

              <div class="modal-actions">
                <button type="button" class="btn btn-secondary" @click="closeModal()">Annuler</button>
                <button type="submit" class="btn btn-primary" :disabled="saving">
                  <span x-text="saving ? 'Enregistrement...' : 'Enregistrer'"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/alpinejs/alpine.min.js" defer></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components/sidebar.js"></script>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/auth-guard.js"></script>
  <script src="/static/js/licence-banner.js"></script>
  <script src="/static/js/pages/clients.js"></script>
</body>
</html>
