name: Build desktop executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: Krilia-windows
          - os: macos-latest
            artifact-name: Krilia-macos
          - os: ubuntu-latest
            artifact-name: Krilia-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0

      - name: Installer les dépendances Python
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Construire l'exécutable
        run: pyinstaller desktop/agence_location.spec --distpath desktop/dist --workpath desktop/build --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: desktop/dist/AgenceLocation

      - name: Installer Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Construire l'installateur Windows (Inno Setup)
        if: runner.os == 'Windows'
        run: ISCC.exe desktop/installer.iss
        shell: cmd

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Krilia-windows-setup
          path: desktop/dist/KriliaSetup.exe
